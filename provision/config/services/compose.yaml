services:
  postgres:
    image: postgres:18.6
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - /var/lib/devbox/services/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  valkey:
    image: valkey/valkey:9.2
    restart: "no"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      # valkey-cli reads the password from REDISCLI_AUTH, so the healthcheck
      # below never places it on a process argv.
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      - --save
      - "60"
      - "1"
    ports:
      - "127.0.0.1:${VALKEY_PORT:?VALKEY_PORT is required}:6379"
    volumes:
      - /var/lib/devbox/services/data/valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
