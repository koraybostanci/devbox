services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${HOME}/data/postgres:/var/lib/postgresql/data
