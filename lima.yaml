vmType: vz          # Apple Virtualization.framework — fastest on Apple Silicon
                    # Change to "qemu" if you need snapshots; note: SSH agent socket
                    # path in tools.sh is VZ-specific (/run/host-services/ssh-auth.sock)

arch: aarch64
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
    digest: "sha256:cafa1a965b591b7c4184b484ffd8e625981a79d48f9b4ae8a4adf7b4c5ade927"

cpus: 4
memory: "4GiB"    # reduce to 2GiB on 8GB machines

mounts:
  - location: "{{DEVBOX_DIR}}/provision"
    mountPoint: "/provision"
    writable: false
  # Projects and data directories live on the Mac, mounted as siblings at ~/projects and ~/data.
  # Both survive devbox rebuild. Resolved by the devbox script before passing to limactl.
  - location: "{{PROJECTS_DIR}}"
    mountPoint: "/home/{{.User}}/projects"
    writable: true
  - location: "{{DATA_DIR}}"
    mountPoint: "/home/{{.User}}/data"
    writable: true

user:
  home: "/home/{{.User}}"   # prevent Lima from appending .guest or .linux suffix

ssh:
  localPort: 2222
  forwardAgent: true   # host SSH agent forwarded; private keys never written to VM disk

containerd:
  system: false
  user: true   # rootless; nerdctl available without sudo (Lima default for aarch64)

portForwards:
  - guestPort: 8080
    hostPort: 8080
    hostIP: "127.0.0.1"
  - guestPort: 3000
    hostPort: 3000
    hostIP: "127.0.0.1"
  # Service ports: +10000 offset avoids conflicts with Mac-local services.
  # Rootless note: ports < 1024 cannot be bound by containers — use 8080 for nginx, not 80.
  # To add Valkey: guestPort: 6379  hostPort: 16379
  - guestPort: 5432
    hostPort: 15432
    hostIP: "127.0.0.1"

provision:
  # Step 1: system packages (runs as root)
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      bash /provision/scripts/system.sh

  # Step 2: write secrets and identity to /etc/environment.
  # {{.Env.X}} expands from the host shell environment at `limactl start` time.
  # Guarded by a sentinel so values are only written once — prevents duplicate
  # entries accumulating across stop/start cycles.
  - mode: system
    script: |
      #!/bin/bash
      set -e
      if [ ! -f /etc/devbox-env-written ]; then
        printf 'ANTHROPIC_API_KEY="%s"\n' '{{.Env.ANTHROPIC_API_KEY}}' >> /etc/environment
        printf 'DATABRICKS_HOST="%s"\n'   '{{.Env.DATABRICKS_HOST}}'   >> /etc/environment
        printf 'DATABRICKS_TOKEN="%s"\n'  '{{.Env.DATABRICKS_TOKEN}}'  >> /etc/environment
        printf 'GIT_NAME="%s"\n'          '{{.Env.GIT_NAME}}'          >> /etc/environment
        printf 'GIT_EMAIL="%s"\n'         '{{.Env.GIT_EMAIL}}'         >> /etc/environment
        touch /etc/devbox-env-written
      fi

  # Step 3: user-level tools + configs (runs as the lima user)
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      set -a; source /etc/environment 2>/dev/null || true; set +a
      bash /provision/scripts/tools.sh
