name: Check

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: brew install jq yq docker docker-compose
      - name: Run checks
        run: scripts/check.sh