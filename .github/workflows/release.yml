name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Recovery re-run only: must match the version already in VERSION.
        required: true

# Group by release, not by commit, so runs of the same version from different
# main tips cannot race `gh release upload --clobber`; pending runs queue
# instead of cancelling the active one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # VERSION is the source of truth: the artifact and the tag come from the
      # commit that last changed it, not from a main tip that may have moved on.
      - name: Guard version and ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            printf 'ERROR: releases are built from main only (ref: %s)\n' "$REF" >&2
            exit 1
          fi
          version_commit="$(git log -1 --format=%H -- VERSION)"
          if [ -z "$version_commit" ]; then
            printf 'ERROR: could not find the commit that last changed VERSION\n' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$version_commit" HEAD; then
            printf 'ERROR: the commit that last changed VERSION (%s) is not reachable from HEAD; rerun from main\n' \
              "$version_commit" >&2
            exit 1
          fi
          version="$(git show "$version_commit:VERSION")"
          version="${version#"${version%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            printf 'ERROR: VERSION must be MAJOR.MINOR.PATCH (found: %s)\n' "$version" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            input_version="$INPUT_VERSION"
            input_version="${input_version#"${input_version%%[![:space:]]*}"}"
            input_version="${input_version%"${input_version##*[![:space:]]}"}"
            if [ "$input_version" != "$version" ]; then
              printf 'ERROR: dispatch input %s does not match VERSION at %s (%s); workflow_dispatch is recovery-only\n' \
                "$input_version" "$version_commit" "$version" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_ENV"
          printf 'version_commit=%s\n' "$version_commit" >>"$GITHUB_ENV"
          printf 'Releasing v%s from release commit %s\n' "$version" "$version_commit"

      - name: Determine release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=create
          tag_exists=false
          release_exists=false
          tag_commit="$(git rev-parse -q --verify "refs/tags/v$version^{commit}" 2>/dev/null || true)"
          if gh release view "v$version" >/dev/null 2>&1; then
            release_exists=true
          fi
          if [ "$release_exists" = true ]; then
            # Fail closed: a failed query is not "no assets" and not
            # "not a draft". Treating it as empty would classify a complete
            # published release as an incomplete draft and clobber it during
            # recovery.
            if ! is_draft="$(gh release view "v$version" --json isDraft --jq .isDraft)"; then
              printf 'ERROR: release v%s exists but its draft state could not be queried; retry once the GitHub API is available.\n' \
                "$version" >&2
              exit 1
            fi
            case "$is_draft" in
              true|false) ;;
              *)
                printf 'ERROR: release v%s did not report a usable isDraft value; refusing to continue.\n' \
                  "$version" >&2
                exit 1
                ;;
            esac
            if ! target_commitish="$(gh release view "v$version" --json targetCommitish --jq .targetCommitish)"; then
              printf 'ERROR: release v%s exists but its target commit could not be queried; retry once the GitHub API is available.\n' \
                "$version" >&2
              exit 1
            fi
            case "$target_commitish" in
              ""|null)
                printf 'ERROR: release v%s did not report a usable target commit; refusing to continue.\n' \
                  "$version" >&2
                exit 1
                ;;
            esac
            if ! assets="$(gh release view "v$version" --json assets --jq '.assets[].name')"; then
              printf 'ERROR: release v%s exists but its assets could not be queried; retry once the GitHub API is available.\n' \
                "$version" >&2
              exit 1
            fi
            missing=""
            for expected in "devbox-$version.tar.gz" SHA256SUMS SHA256SUMS.sig; do
              if ! printf '%s\n' "$assets" | grep -qx "$expected"; then
                missing="$missing $expected"
              fi
            done
            if [ "$is_draft" = true ]; then
              if [ -z "$missing" ]; then
                # Complete draft: verify the existing assets before trusting
                # them; a draft is never rebuilt or uploaded just because its
                # asset names look complete.
                state=verify
                printf 'Draft release v%s already has all asset names; the assets will be downloaded and verified.\n' \
                  "$version"
              elif [ -n "$tag_commit" ]; then
                # The tag already points at the release commit; the release
                # can be completed from this checkout.
                if [ "$tag_commit" != "$version_commit" ]; then
                  printf 'ERROR: draft release v%s is missing:%s but tag v%s is at %s, not at the release commit %s; this draft cannot be recovered. Delete the draft and bump VERSION to release again.\n' \
                    "$version" "$missing" "$version" "$tag_commit" "$version_commit" >&2
                  exit 1
                fi
                state=recover
                printf 'Recovering draft release v%s (missing:%s; tag v%s is at the release commit)\n' \
                  "$version" "$missing" "$version"
              elif [ "$target_commitish" = "$version_commit" ]; then
                # Draft releases do not create the git tag until they are
                # published, so an untagged draft is recoverable when its
                # target commit is the release commit.
                state=recover
                printf 'Recovering untagged draft release v%s (missing:%s; target commit %s is the release commit)\n' \
                  "$version" "$missing" "$target_commitish"
              else
                printf 'ERROR: draft release v%s is missing:%s but tag v%s does not exist and its target commit %s is not the release commit %s; this draft cannot be recovered. Delete the draft and bump VERSION to release again.\n' \
                  "$version" "$missing" "$version" "$target_commitish" "$version_commit" >&2
                exit 1
              fi
            elif [ -z "$missing" ]; then
              printf 'ERROR: release v%s is already published with all assets; bump VERSION to release again.\n' \
                "$version" >&2
              exit 1
            else
              printf 'ERROR: release v%s is published but missing:%s; a published release is never overwritten. Bump VERSION to release again.\n' \
                "$version" "$missing" >&2
              exit 1
            fi
          else
            if [ -n "$tag_commit" ]; then
              if [ "$tag_commit" != "$version_commit" ]; then
                printf 'ERROR: tag v%s exists at %s, not at the release commit %s; bump VERSION to release again.\n' \
                  "$version" "$tag_commit" "$version_commit" >&2
                exit 1
              fi
              tag_exists=true
            fi
          fi
          printf 'release_state=%s\n' "$state" >>"$GITHUB_ENV"
          printf 'tag_exists=%s\n' "$tag_exists" >>"$GITHUB_ENV"

      - name: Check out the release commit
        run: git checkout --detach "$version_commit"

      - name: Verify existing draft assets
        if: env.release_state == 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          download_dir="$(mktemp -d)"
          trap 'command rm -rf "$download_dir"' EXIT
          if ! gh release download "v$version" --dir "$download_dir" --pattern '*'; then
            printf 'ERROR: could not download the assets of draft release v%s; refusing to rebuild or overwrite it.\n' \
              "$version" >&2
            exit 1
          fi
          if scripts/release.sh verify "$download_dir/devbox-$version.tar.gz"; then
            printf 'release_state=ready\n' >>"$GITHUB_ENV"
            printf 'Draft release v%s assets verified against the committed public key.\n' \
              "$version"
          else
            # The assets do not verify. Recover only when the draft is tied to
            # the release commit: tag v$version exists at $version_commit, or
            # no tag exists and the draft's target commit is $version_commit.
            # A failed query is not recoverable; fail closed.
            if ! target_commitish="$(gh release view "v$version" --json targetCommitish --jq .targetCommitish)"; then
              printf 'ERROR: draft release v%s failed verification and its target commit could not be queried; retry once the GitHub API is available.\n' \
                "$version" >&2
              exit 1
            fi
            case "$target_commitish" in
              ""|null)
                printf 'ERROR: draft release v%s failed verification and did not report a usable target commit; refusing to continue.\n' \
                  "$version" >&2
                exit 1
                ;;
            esac
            tag_commit="$(git rev-parse -q --verify "refs/tags/v$version^{commit}" 2>/dev/null || true)"
            if [ -n "$tag_commit" ]; then
              if [ "$tag_commit" != "$version_commit" ]; then
                printf 'ERROR: draft release v%s failed verification but tag v%s is at %s, not at the release commit %s; this draft cannot be recovered. Delete the draft and bump VERSION to release again.\n' \
                  "$version" "$version" "$tag_commit" "$version_commit" >&2
                exit 1
              fi
              printf 'release_state=recover\n' >>"$GITHUB_ENV"
              printf 'Recovering draft release v%s (assets failed verification; tag v%s is at the release commit)\n' \
                "$version" "$version"
            elif [ "$target_commitish" = "$version_commit" ]; then
              printf 'release_state=recover\n' >>"$GITHUB_ENV"
              printf 'Recovering untagged draft release v%s (assets failed verification; target commit %s is the release commit)\n' \
                "$version" "$target_commitish"
            else
              printf 'ERROR: draft release v%s failed verification but tag v%s does not exist and its target commit %s is not the release commit %s; this draft cannot be recovered. Delete the draft and bump VERSION to release again.\n' \
                "$version" "$version" "$target_commitish" "$version_commit" >&2
              exit 1
            fi
          fi

      - name: Build release
        if: env.release_state == 'create' || env.release_state == 'recover'
        run: scripts/release.sh build

      - name: Sign release
        if: env.release_state == 'create' || env.release_state == 'recover'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            printf 'ERROR: RELEASE_SIGNING_KEY is not configured for the release environment\n' >&2
            exit 1
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key"
          scripts/release.sh sign "dist/devbox-$version/devbox-$version.tar.gz" --key "$key"

      - name: Verify release
        if: env.release_state == 'create' || env.release_state == 'recover'
        run: scripts/release.sh verify "dist/devbox-$version/devbox-$version.tar.gz"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          draft_url="$SERVER_URL/$REPOSITORY/releases/edit/v$version"
          if [ "$release_state" = "verify" ]; then
            printf 'ERROR: internal error: draft verification did not complete\n' >&2
            exit 1
          fi
          if [ "$release_state" = "ready" ]; then
            printf 'Draft release v%s is already prepared with all assets; nothing was rebuilt or uploaded.\n' \
              "$version"
            printf 'Review the release notes and assets, then publish the draft in the GitHub UI: %s\n' \
              "$draft_url"
            exit 0
          fi
          if [ "$release_state" = "recover" ]; then
            gh release upload "v$version" \
              "dist/devbox-$version/devbox-$version.tar.gz" \
              "dist/devbox-$version/SHA256SUMS" \
              "dist/devbox-$version/SHA256SUMS.sig" \
              --clobber
            printf 'Completed draft release v%s from release commit %s (missing assets uploaded; the release stays a draft)\n' \
              "$version" "$version_commit"
            printf 'Review the release notes and assets, then publish the draft in the GitHub UI: %s\n' \
              "$draft_url"
            exit 0
          fi
          args=(
            "v$version"
            "dist/devbox-$version/devbox-$version.tar.gz"
            "dist/devbox-$version/SHA256SUMS"
            "dist/devbox-$version/SHA256SUMS.sig"
            --title "devbox v$version"
            --generate-notes
            --draft
          )
          case "$version" in
            *-*) args+=(--prerelease) ;;
          esac
          if [ "$tag_exists" != "true" ]; then
            args+=(--target "$version_commit")
          fi
          gh release create "${args[@]}"
          printf 'Created draft release v%s from release commit %s; it is not public until a maintainer publishes it\n' \
            "$version" "$version_commit"
          printf 'Review the release notes and assets, then publish the draft in the GitHub UI: %s\n' \
            "$draft_url"
