<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="devbox icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B212B"/>
      <stop offset="1" stop-color="#0E1218"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#2A313C" stroke-width="2"/>

  <!-- open box -->
  <g fill="none" stroke="#E8ECF2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="58" width="60" height="42" rx="7" fill="#1D242F"/>
    <path d="M40 58 L24 47"/>
    <path d="M88 58 L104 47"/>
  </g>

  <!-- terminal prompt -->
  <g fill="none" stroke="#E95420" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 68 L61 79 L50 90"/>
    <path d="M69 90 H81"/>
  </g>
</svg>
