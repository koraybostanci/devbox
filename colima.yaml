cpu: {{CPU}}
memory: {{MEMORY}}
disk: {{DISK}}
arch: aarch64
vmType: vz
runtime: docker
mountType: virtiofs
autoActivate: false

mounts:
  - location: {{PROVISION_PATH}}
    mountPoint: /provision
    writable: false
  - location: {{PROJECTS_PATH}}
    mountPoint: /mnt/devbox/projects
    writable: true
  - location: {{DATA_PATH}}
    mountPoint: /mnt/devbox/data
    writable: true

sshPort: 0
forwardAgent: false
sshConfig: false
